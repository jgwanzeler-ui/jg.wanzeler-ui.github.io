<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Nome · Links</title>
<meta name="description" content="Todos os meus links em um só lugar.">

<!-- ============================================================
     PRÉVIA AO COMPARTILHAR (WhatsApp, Instagram, etc.)
     Troque o conteúdo abaixo pelo seu nome/descrição.
     ============================================================ -->
<meta property="og:title" content="Nome">
<meta property="og:description" content="Todos os meus links em um só lugar.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23143630'/%3E%3Ccircle cx='12' cy='12' r='5' fill='%23E3A94B'/%3E%3C/svg%3E">

<style>
  :root{
    --bg-deep:#0E2622;
    --bg-deep-2:#143630;
    --card-bg:rgba(21,51,44,0.74);
    --card-border:rgba(244,241,232,0.10);
    --accent:#E3A94B;
    --accent-soft:#F0C77E;
    --text:#F4F1E8;
    --text-muted:#9FB7AE;
    --radius-lg:28px;
    --radius-md:16px;
    --font-display: ui-serif, Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}

  body{
    font-family:var(--font-body);
    color:var(--text);
    background:
      radial-gradient(circle at 20% 0%, rgba(227,169,75,0.10), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(227,169,75,0.06), transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .card{
    width:100%;
    max-width:440px;
    background:var(--card-bg);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border:1px solid var(--card-border);
    border-radius:var(--radius-lg);
    padding:40px 28px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);
    position:relative;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    top:-60px; left:50%;
    width:280px; height:160px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(227,169,75,0.20), transparent);
    pointer-events:none;
  }

  .profile{ text-align:center; position:relative; }

  .avatar-wrap{
    width:96px; height:96px;
    margin:0 auto 18px;
    border-radius:50%;
    padding:3px;
    background:conic-gradient(from 180deg, var(--accent), var(--accent-soft), var(--accent));
  }

  .avatar{
    width:100%; height:100%;
    border-radius:50%;
    background:var(--bg-deep-2);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-size:1.7rem;
    color:var(--accent-soft);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  .name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(1.4rem, 5vw, 1.85rem);
    letter-spacing:0.01em;
    margin:0 0 8px;
  }

  .bio{
    margin:0 auto;
    max-width:320px;
    color:var(--text-muted);
    font-size:0.95rem;
    line-height:1.55;
  }

  /* Divisor animado (linha de "corrente") */
  .wave{ margin:22px 0 18px; opacity:0.85; }
  .wave path{
    fill:none;
    stroke:var(--accent);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-dasharray:6 10;
    animation:flow 6s linear infinite;
  }
  @keyframes flow{ to{ stroke-dashoffset:-160; } }
  @media (prefers-reduced-motion: reduce){
    .wave path{ animation:none; }
  }

  .links{ display:flex; flex-direction:column; gap:12px; }

  .link-item{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px;
    border-radius:var(--radius-md);
    border:1px solid var(--card-border);
    background:rgba(244,241,232,0.03);
    color:var(--text);
    text-decoration:none;
    opacity:0; transform:translateY(8px);
    animation:rise 0.5s ease forwards;
    transition:transform .22s ease, border-color .22s ease, background .22s ease;
  }
  .link-item:hover, .link-item:focus-visible{
    transform:translateY(-2px);
    border-color:var(--accent);
    background:rgba(227,169,75,0.09);
    outline:none;
  }
  .link-item:focus-visible{ box-shadow:0 0 0 2px var(--accent); }

  .link-item.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#1B1410;
    font-weight:600;
  }
  .link-item.primary .link-icon{ color:#1B1410; }
  .link-item.primary:hover{ background:var(--accent-soft); }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .link-item{ animation:none; opacity:1; transform:none; }
  }

  .link-icon{ flex-shrink:0; width:22px; height:22px; color:var(--accent); }
  .link-label{ flex:1; font-size:0.97rem; font-weight:500; }
  .link-arrow{ width:16px; height:16px; opacity:0.55; flex-shrink:0; }

  .footer{
    margin-top:26px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    font-size:0.78rem; color:var(--text-muted);
  }

  .copy-btn{
    border:1px solid var(--card-border);
    background:transparent;
    color:var(--text-muted);
    font-size:0.78rem;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
    font-family:var(--font-body);
  }
  .copy-btn:hover, .copy-btn:focus-visible{ border-color:var(--accent); color:var(--accent-soft); }
</style>
</head>
<body>

<div class="card">
  <div class="profile">
    <div class="avatar-wrap">
      <div class="avatar" id="avatar"></div>
    </div>
    <h1 class="name" id="profileName"></h1>
    <p class="bio" id="profileBio"></p>
  </div>

  <svg class="wave" viewBox="0 0 400 24" preserveAspectRatio="none">
    <path d="M0 12 Q 50 2, 100 12 T 200 12 T 300 12 T 400 12"/>
  </svg>

  <nav class="links" id="linksContainer" aria-label="Meus links"></nav>

  <div class="footer">
    <button class="copy-btn" id="copyBtn" type="button">Copiar link da página</button>
    <span id="year"></span>
  </div>
</div>

<!-- Sprite com os ícones (SVG genéricos, sem usar logos oficiais registrados) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

      <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17" cy="7" r="1" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="icon-whatsapp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 20l1.3-4A8 8 0 1 1 9 19.4L4 20Z"/><path d="M8.5 9.3c.2 2.6 2.6 5 5.2 5.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-facebook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M14 21v-7h2.4l.4-3H14V9.2c0-.9.3-1.5 1.7-1.5H17V5.1c-.3 0-1.3-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2H8.5v3H11v7"/>
    </symbol>

      <path d="M5 5l14 14M19 5L5 19"/>

    </symbol>

      <path d="M9 15l6-6"/><path d="M11 6l1-1a4 4 0 1 1 6 6l-1 1"/><path d="M13 18l-1 1a4 4 0 1 1-6-6l1-1"/>
    </symbol>
  </defs>
</svg>

<script>
/* =====================================================================
   PAINEL DE EDIÇÃO — é só mexer aqui em baixo, no objeto CONFIG.
   Não precisa entender o resto do arquivo para personalizar a página.
   =====================================================================

   1) PERFIL
      name      -> Jonilton wanzeler | Negócios & Tech
      bio       -> uma frase curta sobre você
      avatarUrl -> link de uma foto sua (https://...). Deixe "" para
                   usar suas iniciais em vez de foto.
      initials  -> iniciais mostradas quando não há avatarUrl (ex: "JN")

   2) LINKS
      Cada item da lista "links" é um botão. Os campos são:
      label   -> texto do botão (ex: "Meu WhatsApp")
      url     -> para onde o botão leva
      icon    -> qual ícone usar (veja a lista de chaves abaixo)
      primary -> true deixa o botão em destaque (cor sólida).
                 Use só em 1 link, o mais importante.

      Ícones disponíveis (use exatamente assim no campo "icon"):
      instagram, whatsapp, facebook, x, tiktok, youtube, linkedin,
      github, telegram, pinterest, spotify, email, phone, site,
      pix, link

      Links especiais:
      - WhatsApp: "https://wa.me/5591992341991" (só números)
      - E-mail:   "mailto:jg.wanzeler@gmail.com"
      - Telefone: "tel:+5591992341991"
      - Pix:      pode usar um link de "copia e cola" do seu banco,
                   ou criar um link normal que leva a uma página com
                   sua chave Pix.

      Para adicionar um novo botão, copie um bloco { ... } inteiro,
      cole logo abaixo dele e altere os valores. Para remover, apague
      o bloco inteiro (do { até a , do final).
   ===================================================================== */

const CONFIG = {
  profile: {
    name: "Jonilton Wanzeler",
    bio: "Desenvolvedor • Empresário • Criador de Conteúdo • Tecnologia • IA • Negócios • Inovação.",
    avatarUrl: "",
    initials: "JW"
  },
  links: [
    { label: "Meu Instagram",     url: "https://instagram.com/joniltonwanzeleroficial", icon: "instagram", primary: true },
    { label: "Falar no WhatsApp", url: "https://wa.me/5591992341991",      icon: "whatsapp" },
    { label: "Meu site",          url: "https://https://github.com/jgwanzeler-ui/index.html.git",           icon: "site" },
    { label: "Meu canal no YouTube", url: "https://youtube.com/@joniltonwanzeleroficial", icon: "youtube" },
    { label: "Me chame no Telegram", url: "https://t.me/Joniltonwanzeleroficial",       icon: "telegram" },
    { label: "Enviar e-mail",     url: "mailto:jg.wanzeler@gmail.com",          icon: "email" }
  ]
};

/* ===================== A partir daqui é só o motor da página ===================== */

function renderProfile(p){
  document.getElementById("profileName").textContent = p.name;
  document.getElementById("profileBio").textContent = p.bio;
  document.title = p.name + " · Links";

  const avatarEl = document.getElementById("avatar");
  if(p.avatarUrl){
    const img = document.createElement("img");
    img.src = p.avatarUrl;
    img.alt = p.name;
    avatarEl.appendChild(img);
  } else {
    avatarEl.textContent = p.initials || "?";
  }
}

function renderLinks(links){
  const container = document.getElementById("linksContainer");
  links.forEach((item, i) => {
    const a = document.createElement("a");
    a.href = item.url;
    a.className = "link-item" + (item.primary ? " primary" : "");
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.animationDelay = (i * 0.06) + "s";

    const iconKey = item.icon && document.getElementById("icon-" + item.icon) ? item.icon : "link";

    a.innerHTML = `
      <svg class="link-icon"><use href="#icon-${iconKey}"></use></svg>
      <span class="link-label"></span>
      <svg class="link-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    `;
    a.querySelector(".link-label").textContent = item.label;
    container.appendChild(a);
  });
}

document.getElementById("year").textContent = "© " + new Date().getFullYear();

document.getElementById("copyBtn").addEventListener("click", async () => {
  const btn = document.getElementById("copyBtn");
  try{
    await navigator.clipboard.writeText(window.location.href);
    btn.textContent = "Link copiado!";
  }catch(e){
    btn.textContent = "Copie pela barra de endereço";
  }
  setTimeout(() => btn.textContent = "Copiar link da página", 2000);
});

renderProfile(CONFIG.profile);
renderLinks(CONFIG.links);
</script>

</body>
</html>
